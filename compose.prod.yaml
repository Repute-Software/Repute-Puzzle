services:
  puzzle:
    image: ghcr.io/repute-software/repute-puzzle:latest
    container_name: sliding-puzzle
    ports:
      - "8080:8080"
    volumes:
      - ./images:/app/images:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    restart: always
    environment:
      - TZ=UTC
      - RESEND_API_KEY=${RESEND_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


services:
  puzzle:
    image: ghcr.io/doubleutech@proton.me/puzzle:latest  # Replace doubleutech@proton.me with your GitHub username
    container_name: sliding-puzzle
    ports:
      - "8080:8080"
    volumes:
      - ./images:/app/images:ro
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


services:
  puzzle:
    build: .
    container_name: sliding-puzzle-staging
    ports:
      - "8080:8080"
    volumes:
      # Mount images directory so operator can add PNG files
      - ./images:/app/images
      # Mount data directory for database persistence
      - ./data:/app/data
      # Mount logs directory for crash dumps
      - ./logs:/app/logs
      # Mount config for easy configuration changes
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    environment:
      - TZ=UTC


puzzle:
  grid_size: 9     # 3x3, 4x4, 5x5, etc.
  discount_percent: 15   # Discount amount for completion
  time_limit: 90         # Time limit in seconds (0 = no limit)
  testing_mode: true     # Set to true to highlight clickable tiles
  scramble_moves: 25  # Number of moves to scramble from solved state
  auto_solve_speed: 50   # Milliseconds per move for auto-solve animation
database:
  path: "./data/puzzle.db"
server:
  port: 8080
images:
  directory: "./images"

